name: Model Training CICD
permissions:
  id-token: write
  contents: write
 
on:
  - push

# Forces the runner engine to bypass the Node.js deprecation restriction
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    # This instructs GitHub to run all steps directly inside the official CML environment
    container: docker://dvcorg/cml-py3:latest
   
    steps:
      # Explicitly using v4 to ensure native compatibility inside the Docker run block
      - uses: actions/checkout@v4

      - name: Train model
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -r requirements.txt
          python train_model.py

          echo "RF and LR Model Score" > report.md
          cat scores.txt >> report.md
         
          echo -e "\nConfusion Matrix & Feature Importance" > report1.md
          echo '![](./ConfusionMatrix.png "ConfusionMatrix")' >> report1.md
          echo '![](./FeatureImportance.png "FeatureImportance")' >> report1.md
     
          cat report.md report1.md > combined_file.md
          cml comment create combined_file.md
